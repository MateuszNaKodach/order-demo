services:
  axonserver:
    image: axoniq/axonserver
    ports:
      - "8024:8024"   # UI / HTTP
      - "8124:8124"   # gRPC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: demouser
      POSTGRES_PASSWORD: thepassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demouser -d order"]
      interval: 5s
      timeout: 3s
      retries: 10
